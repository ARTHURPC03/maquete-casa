<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquete Casa Cacupé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: maquete 3D ocupa a tela; painel lateral (desktop) ou gaveta inferior (celular) com orçamento, cômodos, opções e móveis. */
:root{
  --bg:#e6eaed; --panel:#f7f8f9; --ink:#1d2730; --muted:#5d6b77; --line:#cfd6dc;
  --sea:#17708a; --sea-soft:#d4e8ee; --wall:#fbfbfa; --glass:#7fb8cc; --warn:#b5651d; --ok:#2f7d4f;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1f; --panel:#1b2228; --ink:#e4e9ed; --muted:#93a1ad; --line:#2d3740;
  --sea:#4fb3cf; --sea-soft:#1c3640; --wall:#e3e6e8; --glass:#5aa3bd; --warn:#e39a55; --ok:#6cc792; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1f; --panel:#1b2228; --ink:#e4e9ed; --muted:#93a1ad; --line:#2d3740;
  --sea:#4fb3cf; --sea-soft:#1c3640; --wall:#e3e6e8; --glass:#5aa3bd; --warn:#e39a55; --ok:#6cc792; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
button{font-family:inherit}
.app{position:relative;height:100%;display:grid;grid-template-columns:1fr 390px}
#stage{position:relative;min-width:0;overflow:hidden}
#stage canvas{display:block;touch-action:none}
.hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100% - 32px)}
.hud>*{pointer-events:auto}
.brand{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--f-data);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px/1 var(--f-body);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:700 13px/1 var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sea);color:#fff}
.btn{font:500 12px/1 var(--f-data);letter-spacing:.03em;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--sea);color:var(--sea);background:var(--sea-soft)}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible,.room:focus-visible,.opt:focus-visible,label.it:focus-within{outline:2px solid var(--sea);outline-offset:2px}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;font:500 11px var(--f-data);color:var(--muted);pointer-events:none}
.lbl{font:600 12px/1.1 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:4px 7px;border-radius:4px;white-space:nowrap;cursor:pointer;user-select:none}
.lbl.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.lbl small{font:400 10px var(--f-data);color:var(--muted);margin-left:4px}
.lbl.on small{color:#e6f4f8}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{padding:16px max(16px,env(safe-area-inset-right,0px)) 12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph h2{font:800 17px/1.2 var(--f-display);font-stretch:85%;margin:0;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.budget{display:flex;flex-direction:column;gap:6px}
.budget .nums{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.budget .nums b{font:800 20px/1 var(--f-display);font-stretch:85%}
.budget .nums span{font:500 11px var(--f-data);color:var(--muted)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar .band{position:absolute;top:0;bottom:0;background:var(--sea-soft)}
.bar .rng{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--sea)}
.scale{display:flex;justify-content:space-between;font:400 10px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.plan{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.plan b{font:700 13px/1.15 var(--f-body)}
.plan small{font:400 11px/1.3 var(--f-body);color:var(--muted)}
.plan span{font:500 10px var(--f-data);color:var(--sea);font-variant-numeric:tabular-nums}
.plan[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.plan:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.list{overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 24px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.fl{font:500 11px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;display:flex;justify-content:space-between}
.room{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);cursor:pointer}
.room.on{border-color:var(--sea);box-shadow:inset 3px 0 0 var(--sea)}
.room h3{margin:0;font:700 15px/1.25 var(--f-body);display:flex;justify-content:space-between;gap:8px}
.room h3 span{font:500 11px var(--f-data);color:var(--muted);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.room .note{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.room .sub{font:500 11px var(--f-data);color:var(--sea);margin-top:6px;font-variant-numeric:tabular-nums}
.det{display:none;flex-direction:column;gap:8px;margin-top:10px}
.room.on .det{display:flex}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:600 12px/1 var(--f-body);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.desc{font-size:13px;line-height:1.45;margin:0}
.photo{display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;position:relative;border-radius:6px;overflow:hidden}
.photo img{display:block;width:100%;height:150px;object-fit:cover}
.photo span{position:absolute;left:8px;bottom:8px;font:600 11px var(--f-data);background:rgba(0,0,0,.6);color:#fff;padding:4px 6px;border-radius:4px}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
label.it{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-size:13px;line-height:1.35;padding:4px 0;cursor:pointer}
label.it input{accent-color:var(--sea)}
label.it .pr{font:400 11px var(--f-data);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
label.it.done>span:first-of-type{text-decoration:line-through;color:var(--muted)}
label.it em{font-style:normal;color:var(--muted)}
label.it a{color:var(--sea)}
.foot{border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 12px 18px;font-size:12px;color:var(--muted);line-height:1.4}
.handle{display:none}
.ov>*{flex:none}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 97%,transparent);z-index:20;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));gap:12px;overflow:auto}
.ov header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov h2{margin:0;font:800 22px/1.1 var(--f-display);font-stretch:80%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.gal button{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--panel);cursor:pointer;overflow:hidden;text-align:left;color:var(--ink)}
.gal img{display:block;width:100%;aspect-ratio:9/12;object-fit:cover}
.gal b{display:block;font:700 13px var(--f-body);padding:8px 10px 2px}
.gal small{display:block;font:400 12px var(--f-body);color:var(--muted);padding:0 10px 10px}
.cmp{position:relative;flex:none;width:min(520px,100%,calc((100vh - 170px)*9/16));margin:0 auto;aspect-ratio:9/16;border-radius:8px;overflow:hidden;user-select:none;touch-action:none;background:#000}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .knob{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cmp .knob::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font:700 16px var(--f-body)}
.cmp .tag{position:absolute;top:10px;font:600 11px var(--f-data);background:rgba(0,0,0,.6);color:#fff;padding:4px 7px;border-radius:4px}
.cap{max-width:520px;margin:0 auto;font-size:13px;color:var(--muted);line-height:1.45;text-align:center}
table.deals{width:100%;border-collapse:collapse;font-size:13px}
table.deals th{text-align:left;font:500 11px var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
table.deals td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.deals td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
table.deals a{color:var(--sea)}
.tw{overflow-x:auto}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.store{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px;line-height:1.4}
.store b{display:block;font-size:14px}
.store small{color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:50vh;transition:max-height .25s}
  aside.min{max-height:148px}
  .handle{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;border:0;cursor:pointer;flex:none}
  .ph{padding-top:8px}
  .brand{font-size:21px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>

<div class="app">
  <div id="stage">
    <div class="hud">
      <div class="brand">Casa Cacupé<small>maquete aproximada · planta 1:50 + vídeos</small></div>
      <div class="seg" role="group" aria-label="Situação">
        <button id="mHoje" aria-pressed="false">Como está</button>
        <button id="mProp" aria-pressed="true">Proposta</button>
      </div>
      <div class="row" id="floors" role="group" aria-label="Andar"></div>
      <div class="row">
        <button class="btn" id="bTop" aria-pressed="false">Vista de cima</button>
        <button class="btn" id="bExp" aria-pressed="false">Separar andares</button>
        <button class="btn" id="bPlan" aria-pressed="false">Planta</button>
        <button class="btn" id="bReset">Recentrar</button>
      </div>
    </div>
    <div class="hint">arraste para girar · pinça/scroll para zoom · toque num cômodo</div>
  </div>
  <aside id="panel">
    <button class="handle" id="handle" aria-label="Abrir ou fechar a lista"></button>
    <div class="ph">
      <div class="plans" id="plans" role="group" aria-label="Planos prontos"></div>
      <div class="budget" id="budget"></div>
      <div class="row">
        <button class="btn" id="bOrc">Orçamento detalhado</button>
        <button class="btn" id="bFotos">Fotos antes e depois</button>
        <button class="btn" id="bDeals">Ofertas Black Friday</button>
        <a class="btn" id="bPedido" href="https://github.com/ARTHURPC03/maquete-casa/issues/new?template=pedido.yml" target="_blank" rel="noopener" style="text-decoration:none">Pedir mudança</a>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot" id="foot"></div>
  </aside>
</div>
<div class="ov" id="ovFotos" hidden></div>
<div class="ov" id="ovDeals" hidden></div>
<div class="ov" id="ovOrc" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script src="furniture.js"></script>
<script>
const MODEL=/*MODEL*/null, TEX=/*TEX*/null, ROOMS=/*ROOMS*/null, PRICES=/*PRICES*/null, DEALS=/*DEALS*/null, PHOTOS=/*PHOTOS*/null, EXTRA=/*EXTRA*/null;
const BUDGET=[100000,250000];
const FULL=Object.fromEntries(ROOMS.filter(r=>r.opts.length).map(r=>[r.id,(r.opts.find(o=>!o.id.endsWith('_enx'))||r.opts[0]).id]));
const ENX=Object.fromEntries(ROOMS.filter(r=>r.opts.some(o=>o.id.endsWith('_enx'))).map(r=>[r.id,r.id+'_enx']));
const PLANS=[
 {id:'E',name:'Plano Enxuto',sub:'Recomendado: aluguel de 1–2 anos, eventos e Instagram. Gasta onde tem evento e câmera e aproveita o que já está na casa',c:{...FULL,...ENX}},
 {id:'A',name:'Plano A',sub:'Completo: poker, TV e academia no salão; podcast na sala redonda',c:{...FULL,jogos:'pokertv',redonda:'podcast',vidro:'edicao'}},
 {id:'B',name:'Plano B',sub:'Completo: cinema e poker no salão, academia na sala de vidro, podcast na redonda',c:{...FULL,jogos:'cinepoker',redonda:'podcast',vidro:'gym'}},
 {id:'C',name:'Plano C',sub:'Completo: cinema na redonda; poker, TV e academia no salão',c:{...FULL,jogos:'pokertv',redonda:'cinema',vidro:'edicao'}}];
const FLOORS=[{id:'garagem',name:'Garagem',y:0},{id:'terreo',name:'Térreo',y:3.0},{id:'p1',name:'1º pav.',y:6.0},{id:'p2',name:'2º pav.',y:9.0}];
const FLN={garagem:'Garagem',terreo:'Térreo',p1:'1º pavimento',p2:'2º pavimento'};
const WALL_H=2.7;
const {F:FN,MAT,M}=window.FURN;
// peças de arquitetura que não são móvel (ficam aqui para não misturar com a biblioteca de móveis)
FN.railing=(g,it)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(it.w,1.1,.02),MAT.glass);o.position.y=.55;g.add(o);const t=new THREE.Mesh(new THREE.BoxGeometry(it.w,.04,.05),MAT.steel);t.position.y=1.1;g.add(t)};
FN.pergola=(g,it)=>{const w=it.w,d=it.d,h=2.6,wd=MAT.teak||MAT.walnut;const B=(a,b,c,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),wd);o.position.set(x,y,z);o.castShadow=true;g.add(o)};
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>B(.15,h,.15,a*(w/2-.08),h/2,b*(d/2-.08)));[-1,1].forEach(b=>B(w+.3,.2,.12,0,h-.1,b*(d/2-.08)));
  for(let i=0;i<9;i++)B(.06,.14,d+.4,-w/2+i*w/8,h+.07,0)};
FN.spa=FN.spa||((g,it)=>{});
const _spa=FN.spa;FN.spa=(g,it)=>{const r=it.w/2;const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.75,40),MAT.trav);o.position.y=.375;o.castShadow=true;g.add(o);
  const w=new THREE.Mesh(new THREE.CylinderGeometry(r-.12,r-.12,.02,40),MAT.water);w.position.y=.74;g.add(w)};
const FLOORMAT={porcBranco:M(0xe8e6e1,{roughness:.22}),porcBege:M(0xd6ccbc,{roughness:.4}),madeira:M(0x6a4430,{roughness:.55}),
  vinilico:M(0xa47c55,{roughness:.6}),deck:M(0x8b6845,{roughness:.8}),trav:M(0xd8cbb3,{roughness:.7})};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const brl=v=>v==null?'—':'R$ '+Math.round(v).toLocaleString('pt-BR');
const kbrl=v=>v>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:v<10000?1:0})+' mil':brl(v);
let mode='prop';
const choice={};ROOMS.forEach(r=>{if(r.opts.length)choice[r.id]=r.def||r.opts[0].id});
try{Object.assign(choice,JSON.parse(localStorage.getItem('cacupe-opt3')||'{}'))}catch(e){}
let done={};try{done=JSON.parse(localStorage.getItem('cacupe-done2')||'{}')}catch(e){}
const saveState=()=>{try{localStorage.setItem('cacupe-opt3',JSON.stringify(choice));localStorage.setItem('cacupe-done2',JSON.stringify(done))}catch(e){}};

// ---------- cena
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const labelR=new THREE.CSS2DRenderer();labelR.domElement.style.cssText='position:absolute;inset:0;pointer-events:none';stage.appendChild(labelR.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.1,400);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.495;controls.minDistance=3;controls.maxDistance=110;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8070,.75));
const sun=new THREE.DirectionalLight(0xfff3e2,1.0);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-24;sc.right=24;sc.top=24;sc.bottom=-24;sc.near=1;sc.far=120;sun.shadow.bias=-.0006;scene.add(sun);scene.add(sun.target);
let CX,CZ;{const b=Object.values(MODEL.floors).map(f=>f.bounds);CX=(Math.min(...b.map(x=>x[0]))+Math.max(...b.map(x=>x[2])))/2;CZ=(Math.min(...b.map(x=>x[1]))+Math.max(...b.map(x=>x[3])))/2}
const wallMat=new THREE.MeshStandardMaterial({roughness:.9,transparent:true});
const glassMat=new THREE.MeshStandardMaterial({roughness:.08,transparent:true,opacity:.25,depthWrite:false,color:0x9fcbd8});
const groups={},floorMeshes={},finish={},roomHolders={},labels=[];
let explode=false,showPlan=false,sel='all',activeRoom=null,topView=false;
const lvl=f=>{const i=FLOORS.findIndex(x=>x.id===f);return explode?i*6.2:FLOORS[i].y};
function segMesh(list,h,th,mat){const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat,list.length),o=new THREE.Object3D();
  list.forEach((s,i)=>{const[x1,z1,x2,z2]=s,L=Math.hypot(x2-x1,z2-z1);o.position.set((x1+x2)/2,h/2,(z1+z2)/2);o.rotation.set(0,-Math.atan2(z2-z1,x2-x1),0);o.scale.set(L+th*.5,h,th);o.updateMatrix();m.setMatrixAt(i,o.matrix)});
  m.castShadow=true;m.receiveShadow=true;return m}
const loader=new THREE.TextureLoader();
for(const F of FLOORS){
  const d=MODEL.floors[F.id],g=new THREE.Group();const[x0,z0,x1,z1]=d.bounds;
  const tex=loader.load(TEX[F.id]);tex.anisotropy=8;tex.encoding=THREE.sRGBEncoding;
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),new THREE.MeshStandardMaterial({map:tex,transparent:true,alphaTest:.35,roughness:.8}));
  pl.rotation.x=-Math.PI/2;pl.position.set((x0+x1)/2,.005,(z0+z1)/2);pl.receiveShadow=true;g.add(pl);floorMeshes[F.id]=pl;
  const slab=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.35,color:0x8d969d,side:THREE.BackSide}));

   <div class="tw"><table class="deals"><thead><tr><th>Ambiente</th><th>Produto</th><th>Loja</th><th style="text-align:right">Preço</th><th style="text-align:right">De</th><th style="text-align:right">Desc.</th></tr></thead><tbody>
   ${d.produtos.map(p=>`<tr><td>${p.ambiente||''}</td><td>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.produto}</a>`:p.produto}${p.medidas?`<br><small style="color:var(--muted)">${p.medidas}</small>`:''}</td><td>${p.loja}</td><td class="n">${brl(p.preco)}</td><td class="n">${p.preco_de?brl(p.preco_de):''}</td><td class="n">${p.desconto_pct?Math.round(p.desconto_pct)+'%':''}</td></tr>`).join('')}
   </tbody></table></div>`;
  ovD.hidden=false;ovD.querySelector('[data-close]').onclick=()=>ovD.hidden=true};
// ---------- orçamento detalhado
const ovO=document.getElementById('ovOrc');
document.getElementById('bOrc').onclick=()=>{const rows=[],agg={};let tb=0,tp=0;
  ROOMS.forEach(r=>{const o=r.opts.find(o=>o.id===choice[r.id]);if(!o)return;o.items.forEach(it=>{const c=itemCost(it);if(!c||c.bom==null)return;
    const u=c.u.p;rows.push({r:r.name,f:FLN[r.floor],n:it.n,q:it.q||1,b:c.bom,p:c.prem,ub:u.bom,up:u.premium});tb+=c.bom;tp+=c.prem;
    const a=agg[it.k]||(agg[it.k]={n:it.n,q:0,d:0,pp:u.premium?.produto,pl:u.premium?.loja,rs:new Set()});a.rs.add(r.name);if(a.rs.size>1)a.n=it.n.replace(/ (para|do|da|de) .*/,'')+' (vários cômodos)';a.q+=it.q||1;a.d+=c.prem-c.bom})});
  const top=Object.values(agg).sort((a,b)=>b.d-a.d).slice(0,6);const pl=PLANS.find(pl=>Object.entries(pl.c).every(([k,v])=>choice[k]===v));
  const lk=(x,v)=>x?.url?`<a href="${x.url}" target="_blank" rel="noopener">${brl(v)}</a>`:brl(v);
  ovO.innerHTML=`<header><h2>Orçamento detalhado${pl?' · '+pl.name:''}</h2><button class="btn" data-close>Fechar</button></header>
   <p class="cap" style="text-align:left;margin:0;max-width:70ch"><b style="color:var(--ink)">Faixa boa: ${brl(tb)}.</b> É o número para planejar: a opção mais barata achada para cada peça, entre a pesquisa geral e as ofertas (Tok&amp;Stok, Leroy, Mobly, MadeiraMadeira, Decathlon, Casas Bahia...). <b style="color:var(--ink)">Premium: ${brl(tp)}.</b> É a linha mais cara de cada peça, só como teto de referência. A diferença vem de poucas peças:</p>
   <div class="tw"><table class="deals"><thead><tr><th>Peça</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Diferença bom → premium</th><th>Premium usado</th></tr></thead><tbody>
   ${top.map(a=>`<tr><td>${a.n}</td><td class="n">${a.q}</td><td class="n">+ ${brl(a.d)}</td><td>${a.pp||''}${a.pl?` <small style="color:var(--muted)">(${a.pl})</small>`:''}</td></tr>`).join('')}</tbody></table></div>
   <div class="tw"><table class="deals"><thead><tr><th>Andar · cômodo</th><th>Peça</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Bom</th><th>Loja</th><th style="text-align:right">Premium</th></tr></thead><tbody>
   ${rows.map(x=>`<tr><td>${x.f} · ${x.r}</td><td>${x.n}</td><td class="n">${x.q}</td><td class="n">${lk(x.ub,x.b)}</td><td>${x.ub?.loja||''}</td><td class="n">${lk(x.up,x.p)}</td></tr>`).join('')}
   <tr><td colspan="3"><b>Total</b></td><td class="n"><b>${brl(tb)}</b></td><td></td><td class="n"><b>${brl(tp)}</b></td></tr></tbody></table></div>
   <p class="cap" style="text-align:left;margin:0">Não inclui marcenaria, cortinas sob medida da casa inteira, mão de obra, frete e o que já fica com a casa. Troque as opções de cada cômodo ou o plano e abra de novo para recalcular.</p>`;
  ovO.hidden=false;ovO.querySelector('[data-close]').onclick=()=>ovO.hidden=true};
addEventListener('keydown',e=>{if(e.key==='Escape'){ovF.hidden=true;ovD.hidden=true;ovO.hidden=true}});

// clique no piso → cômodo mais próximo
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const rc=renderer.domElement.getBoundingClientRect();
  mv.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(mv,camera);
  const cands=FLOORS.filter(F=>groups[F.id].visible&&!(sel!=='all'&&FLOORS.findIndex(x=>x.id===F.id)<FLOORS.findIndex(x=>x.id===sel))).map(F=>floorMeshes[F.id]);
  const hit=ray.intersectObjects(cands,false)[0];if(!hit)return;const fid=FLOORS.find(F=>floorMeshes[F.id]===hit.object).id,p=hit.point;
  let best=null,bd=1e9;ROOMS.filter(r=>r.floor===fid).forEach(r=>{const d=Math.hypot(r.x-p.x,r.z-p.z);if(d<bd){bd=d;best=r}});if(best&&bd<6)focusRoom(best.id)});

setMode('prop');setFloor('all',false);
{const k=camera.aspect<1?1.9:1;camera.position.set(CX-26*k,30*k,CZ+34*k);controls.target.set(CX,4.5,CZ)}
(function loop(t){requestAnimationFrame(loop);if(anim)anim(t);controls.update();renderer.render(scene,camera);labelR.render(scene,camera)})(0);
</script>
